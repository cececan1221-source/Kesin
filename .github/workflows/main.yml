name: HakPay APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          cache: true

      - name: Android Altyapisini Hazirla
        run: |
          rm -rf android lib
          flutter create . --project-name hakpay --org com.hakpay --platforms=android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' $MANIFEST

      - name: ZIP Icindeki Kodlari Otomatik Bul ve Uyumsuzluklari Duzelt
        run: |
          if [ -f HakPay_CLEAN_ADMOB.zip ]; then
            unzip -o HakPay_CLEAN_ADMOB.zip -d temp_zip
            LIB_DIR=$(find temp_zip -type d -name "lib" | head -n 1)
            if [ -n "$LIB_DIR" ]; then
              rm -rf lib
              cp -r "$LIB_DIR" ./lib
            fi
            PUB_FILE=$(find temp_zip -type f -name "pubspec.yaml" | head -n 1)
            if [ -n "$PUB_FILE" ]; then
              cp -f "$PUB_FILE" ./pubspec.yaml
            fi
            rm -rf temp_zip
          fi
          if [ -f pubspec.yaml ]; then
            sed -i 's/3.10.0/3.0.0/g' pubspec.yaml || true
            sed -i -E 's/flutter_lints:.*$/flutter_lints: ^4.0.0/' pubspec.yaml || true
          fi

      - name: APK Uret
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: hakpay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
